name: Reorganize comments section

on:
  push:
    branches:
      - docs/comments-learning-path

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/comments-learning-path

      - name: Reorganize learning section
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p comments-and-documentation/01-comments
          mv comments-and-documentation/examples comments-and-documentation/01-comments/examples
          mv comments-and-documentation/README.md comments-and-documentation/01-comments/README.md
          mv comments-and-documentation/README.pt-BR.md comments-and-documentation/01-comments/README.pt-BR.md
          mv comments-and-documentation/README.es.md comments-and-documentation/01-comments/README.es.md

          python - <<'PY'
          from pathlib import Path

          replacements = {
              'comments-and-documentation/01-comments/README.md': (
                  'comments-and-documentation/examples/',
                  'comments-and-documentation/01-comments/examples/',
              ),
              'comments-and-documentation/01-comments/README.pt-BR.md': (
                  'comments-and-documentation/examples/',
                  'comments-and-documentation/01-comments/examples/',
              ),
              'comments-and-documentation/01-comments/README.es.md': (
                  'comments-and-documentation/examples/',
                  'comments-and-documentation/01-comments/examples/',
              ),
              'README.md': (
                  'comments-and-documentation/README.md',
                  'comments-and-documentation/01-comments/README.md',
              ),
              'README.pt-BR.md': (
                  'comments-and-documentation/README.pt-BR.md',
                  'comments-and-documentation/01-comments/README.pt-BR.md',
              ),
              'README.es.md': (
                  'comments-and-documentation/README.es.md',
                  'comments-and-documentation/01-comments/README.es.md',
              ),
          }

          for file_name, (old, new) in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise RuntimeError(f'Missing expected path in {file_name}: {old}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          cat > comments-and-documentation/README.md <<'EOF'
          <div align="center">

          # Comments, Documentation, and Readability

          [🇺🇸 English](README.md) · [🇧🇷 Português](README.pt-BR.md) · [🇪🇸 Español](README.es.md)

          </div>

          This section teaches how to make Python code easier to understand, explain, maintain, and observe. The sequence begins with comments and advances through docstrings, naming, task markers, logging decisions, and PEP 8 readability.

          ## Learning path

          | Chapter | Main focus | Level | Status |
          |---|---|---|---|
          | [01. Comments](01-comments/README.md) | Explain decisions and non-obvious context without narrating the code | Beginner | Available |
          | 02. Docstrings | Document modules, functions, classes, and methods | Beginner | Planned |
          | 03. Meaningful names | Make code express intention through clear names and small abstractions | Beginner | Planned |
          | 04. Task markers | Use `TODO`, `FIXME`, `NOTE`, and related conventions responsibly | Beginner to intermediate | Planned |
          | 05. Comments versus logging | Separate source-code explanation from runtime observation | Intermediate | Planned |
          | 06. PEP 8 and readability | Apply style guidance while understanding its purpose and limits | Beginner to intermediate | Planned |

          ## Recommended sequence

          Study the chapters in numerical order. Each chapter can also be consulted independently after its prerequisites are understood.

          ```text
          01. Comments
                  ↓
          02. Docstrings
                  ↓
          03. Meaningful names
                  ↓
          04. Task markers
                  ↓
          05. Comments versus logging
                  ↓
          06. PEP 8 and readability
          ```

          ## Section goals

          By the end of this learning path, you should be able to:

          - distinguish comments, docstrings, documentation, type hints, and logs;
          - explain decisions without repeating obvious code;
          - choose names that reveal intention, units, state, and responsibility;
          - record technical tasks with enough context to remain useful;
          - decide when runtime information belongs in logging;
          - apply PEP 8 recommendations with judgment instead of treating them as Python syntax;
          - review code for clarity, accuracy, privacy, and maintainability.

          ## Current chapter

          Start with [Comments in Python](01-comments/README.md). It includes multilingual explanations, executable examples, an exercise, and a quick-reference summary.

          ## Directory structure

          ```text
          comments-and-documentation/
          ├── README.md
          ├── README.pt-BR.md
          ├── README.es.md
          └── 01-comments/
              ├── README.md
              ├── README.pt-BR.md
              ├── README.es.md
              └── examples/
                  ├── business_rule_comments.py
                  ├── unnecessary_comments.py
                  └── useful_comments.py
          ```

          Future chapter directories will be added when their complete content is prepared. Empty placeholders are intentionally avoided so that every tracked chapter directory contains useful material.
          EOF

          cat > comments-and-documentation/README.pt-BR.md <<'EOF'
          <div align="center">

          # Comentários, documentação e legibilidade

          [🇺🇸 English](README.md) · [🇧🇷 Português](README.pt-BR.md) · [🇪🇸 Español](README.es.md)

          </div>

          Esta seção ensina como tornar o código Python mais fácil de entender, explicar, manter e observar. A sequência começa com comentários e avança por docstrings, nomes, marcadores de tarefas, decisões sobre logging e legibilidade segundo a PEP 8.

          ## Trilha de aprendizagem

          | Capítulo | Foco principal | Nível | Status |
          |---|---|---|---|
          | [01. Comentários](01-comments/README.pt-BR.md) | Explicar decisões e contextos não evidentes sem narrar o código | Iniciante | Disponível |
          | 02. Docstrings | Documentar módulos, funções, classes e métodos | Iniciante | Planejado |
          | 03. Nomes significativos | Fazer o código expressar intenção por meio de nomes claros e pequenas abstrações | Iniciante | Planejado |
          | 04. Marcadores de tarefas | Utilizar `TODO`, `FIXME`, `NOTE` e convenções relacionadas com responsabilidade | Iniciante a intermediário | Planejado |
          | 05. Comentários versus logging | Separar explicações no código-fonte da observação durante a execução | Intermediário | Planejado |
          | 06. PEP 8 e legibilidade | Aplicar orientações de estilo compreendendo seus objetivos e limites | Iniciante a intermediário | Planejado |

          ## Sequência recomendada

          Estude os capítulos em ordem numérica. Depois de compreender seus pré-requisitos, cada capítulo também poderá ser consultado de maneira independente.

          ```text
          01. Comentários
                  ↓
          02. Docstrings
                  ↓
          03. Nomes significativos
                  ↓
          04. Marcadores de tarefas
                  ↓
          05. Comentários versus logging
                  ↓
          06. PEP 8 e legibilidade
          ```

          ## Objetivos da seção

          Ao concluir esta trilha, você deverá ser capaz de:

          - diferenciar comentários, docstrings, documentação, type hints e logs;
          - explicar decisões sem repetir código evidente;
          - escolher nomes que revelem intenção, unidades, estado e responsabilidade;
          - registrar tarefas técnicas com contexto suficiente para continuarem úteis;
          - decidir quando informações de execução pertencem ao logging;
          - aplicar recomendações da PEP 8 com discernimento, sem tratá-las como sintaxe do Python;
          - revisar código considerando clareza, exatidão, privacidade e facilidade de manutenção.

          ## Capítulo atual

          Comece por [Comentários em Python](01-comments/README.pt-BR.md). O capítulo inclui explicações multilíngues, exemplos executáveis, exercício e resumo para consulta rápida.

          ## Estrutura do diretório

          ```text
          comments-and-documentation/
          ├── README.md
          ├── README.pt-BR.md
          ├── README.es.md
          └── 01-comments/
              ├── README.md
              ├── README.pt-BR.md
              ├── README.es.md
              └── examples/
                  ├── business_rule_comments.py
                  ├── unnecessary_comments.py
                  └── useful_comments.py
          ```

          Os diretórios dos próximos capítulos serão adicionados quando seus conteúdos completos forem preparados. Evitamos placeholders vazios para que todo diretório de capítulo versionado contenha material útil.
          EOF

