name: Apply File Organizer full-review patch

on:
  push:
    branches:
      - phase-10-file-organizer
    paths:
      - scripts/_apply_file_organizer_full_review.py
      - .github/workflows/apply-file-organizer-full-review.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: phase-10-file-organizer
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest>=9.1,<9.2"
      - name: Normalize helper anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/_apply_file_organizer_full_review.py")
          text = path.read_text(encoding="utf-8")
          wrong = "El organizador no sigue symlinks hijos directos. También rechaza directorio de origen o carpeta de categoría que sea symlink. En Windows, también se rechazan carpetas de categoría que sean junctions NTFS: `is_dir()` sigue un junction, por lo que aceptarlo podría redirigir un movimiento planificado fuera del workspace."
          current = "El organizador no sigue symlinks hijos directos. También rechaza un directorio de origen o carpeta de categoría que sea symlink. En Windows, las carpetas de categoría que sean junctions NTFS también se rechazan: `is_dir()` sigue un junction, por lo que aceptarlo podría redirigir un movimiento planificado fuera del workspace."
          if text.count(wrong) != 1:
              raise SystemExit("expected one Spanish helper anchor")
          path.write_text(text.replace(wrong, current, 1), encoding="utf-8")
          PY
      - name: Apply full-review patch
        run: python scripts/_apply_file_organizer_full_review.py
      - name: Align race tests with new claim boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("practical-projects/06-file-organizer/tests/test_atomic_move.py")
          text = path.read_text(encoding="utf-8")

          def rewrite_function(name: str, transform):
              global text
              start = text.index(f"def {name}(")
              next_start = text.find("\ndef ", start + 1)
              end = len(text) if next_start == -1 else next_start + 1
              block = text[start:end]
              updated = transform(block)
              if updated == block:
                  raise SystemExit(f"no changes made in {name}")
              text = text[:start] + updated + text[end:]

          def source_symlink(block: str) -> str:
              block = block.replace(
                  'with pytest.raises(FileNotFoundError, match="regular file|changed during execution"):',
                  'with pytest.raises(FileNotFoundError, match="planned source data retained"):',
                  1,
              )
              return block

          rewrite_function(
              "test_execute_plan_rejects_source_symlink_replacement_during_mutation",
              source_symlink,
          )

          def source_claim(block: str) -> str:
              start = block.index("    original_rename = os.rename\n")
              end_marker = '    assert retained[0].read_text(encoding="utf-8") == "third-party replacement"\n'
              end = block.index(end_marker, start) + len(end_marker)
              replacement = '''    original_rename_no_replace = file_organizer._rename_no_replace_at
              raced = False

              def racing_rename_no_replace(
                  source_name: str,
                  destination_name: str,
                  *,
                  source_directory_fd: int,
                  destination_directory_fd: int,
              ) -> None:
                  nonlocal raced
                  if (
                      source_name == source.name
                      and source_directory_fd == destination_directory_fd
                      and not raced
                  ):
                      raced = True
                      source.unlink()
                      source.write_text("third-party replacement", encoding="utf-8")
                  original_rename_no_replace(
                      source_name,
                      destination_name,
                      source_directory_fd=source_directory_fd,
                      destination_directory_fd=destination_directory_fd,
                  )

              monkeypatch.setattr(file_organizer, "_supports_secure_directory_fds", lambda: True)
              monkeypatch.setattr(
                  file_organizer,
                  "_rename_no_replace_at",
                  racing_rename_no_replace,
              )

              with pytest.raises(FileNotFoundError, match="planned source data retained"):
                  execute_plan(plan)

              assert source.read_text(encoding="utf-8") == "third-party replacement"
              assert not destination.exists()
              recovery_files = [
                  child for child in tmp_path.iterdir() if child.name.startswith(".fo-recovery-")
              ]
              assert len(recovery_files) == 1
              assert recovery_files[0].read_text(encoding="utf-8") == "planned source"
              retained = [
                  child for child in tmp_path.iterdir() if child.name.startswith(".fo-stage-")
              ]
              assert len(retained) == 1
              assert retained[0].read_text(encoding="utf-8") == "third-party replacement"
          '''
              return block[:start] + replacement + block[end:]

          rewrite_function(
              "test_source_replacement_during_claim_is_preserved_without_unlink",
              source_claim,
          )

          def category_race(block: str) -> str:
              return block.replace(
                  "        if not raced:\n            raced = True\n            category.rename(detached)",
                  "        if source_directory_fd != destination_directory_fd and not raced:\n            raced = True\n            category.rename(detached)",
                  1,
              )

          rewrite_function(
              "test_category_rename_after_fd_open_never_reports_false_destination",
              category_race,
          )

          def root_race(block: str) -> str:
              return block.replace(
                  "        if not raced:\n            raced = True\n            workspace.rename(detached)",
                  "        if source_directory_fd != destination_directory_fd and not raced:\n            raced = True\n            workspace.rename(detached)",
                  1,
              )

          rewrite_function(
              "test_source_root_rename_after_fd_open_never_reports_false_destination",
              root_race,
          )

          def staging_race(block: str) -> str:
              return block.replace(
                  "        if not raced:\n            raced = True\n            stage = tmp_path / source_name",
                  "        if source_name.startswith(\".fo-stage-\") and not raced:\n            raced = True\n            stage = tmp_path / source_name",
                  1,
              )

          rewrite_function(
              "test_staging_replacement_before_final_rename_preserves_pinned_source_data",
              staging_race,
          )

          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate focused patch
        run: |
          python -m py_compile practical-projects/06-file-organizer/file_organizer.py
          python -m py_compile practical-projects/06-file-organizer/tests/test_atomic_move.py
          python -m pytest -q practical-projects/06-file-organizer/tests
          git diff --check
      - name: Commit functional changes
        run: |
          rm scripts/_apply_file_organizer_full_review.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A practical-projects/06-file-organizer scripts/_apply_file_organizer_full_review.py
          git commit -m "Pin File Organizer sources before identity acceptance"
          git push origin HEAD:phase-10-file-organizer
