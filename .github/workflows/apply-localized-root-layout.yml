name: Apply localized root layout

on:
  push:
    branches:
      - fix/localize-root-documents

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ contains(github.event.head_commit.message, '[run-localized-layout]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: fix/localize-root-documents

      - name: Move localized root documents and repair links
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import os
          import posixpath
          import re
          import shutil

          root = Path.cwd()

          moves = {
              "README.pt-BR.md": "docs/localized/README.pt-BR.md",
              "README.es.md": "docs/localized/README.es.md",
              "AUTHORS.pt-BR.md": "docs/localized/AUTHORS.pt-BR.md",
              "AUTHORS.es.md": "docs/localized/AUTHORS.es.md",
              "CONTRIBUTING.pt-BR.md": "docs/localized/CONTRIBUTING.pt-BR.md",
              "CONTRIBUTING.es.md": "docs/localized/CONTRIBUTING.es.md",
              "CODE_OF_CONDUCT.pt-BR.md": "docs/localized/CODE_OF_CONDUCT.pt-BR.md",
              "CODE_OF_CONDUCT.es.md": "docs/localized/CODE_OF_CONDUCT.es.md",
              "SECURITY.pt-BR.md": "docs/localized/SECURITY.pt-BR.md",
              "SECURITY.es.md": "docs/localized/SECURITY.es.md",
              "SUPPORT.pt-BR.md": "docs/localized/SUPPORT.pt-BR.md",
              "SUPPORT.es.md": "docs/localized/SUPPORT.es.md",
          }

          for old, new in moves.items():
              source = root / old
              destination = root / new
              if not source.exists():
                  raise RuntimeError(f"Missing source file: {old}")
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.move(source, destination)

          reverse_moves = {new: old for old, new in moves.items()}
          markdown_link = re.compile(r"(\]\()([^)]+)(\))")
          html_href = re.compile(r"(href=[\"'])([^\"']+)([\"'])")

          def split_anchor(destination):
              if "#" in destination:
                  path, anchor = destination.split("#", 1)
                  return path, "#" + anchor
              return destination, ""

          def rewrite_destination(destination, old_file, new_file):
              if destination.startswith(("mailto:", "tel:", "#")):
                  return destination

              for old, new in moves.items():
                  old_url = f"https://github.com/RamonRDR/python-study-guide/blob/main/{old}"
                  new_url = f"https://github.com/RamonRDR/python-study-guide/blob/main/{new}"
                  if destination.startswith(old_url):
                      return destination.replace(old_url, new_url, 1)

              if destination.startswith(("http://", "https://", "//")):
                  return destination

              path_part, anchor = split_anchor(destination)
              if not path_part:
                  return destination

              old_parent = str(PurePosixPath(old_file).parent)
              if old_parent == ".":
                  old_parent = ""
              resolved = posixpath.normpath(posixpath.join(old_parent, path_part))
              target = moves.get(resolved, resolved)

              file_was_moved = old_file != new_file
              target_was_moved = resolved in moves
              if not file_was_moved and not target_was_moved:
                  return destination

              new_parent = str(PurePosixPath(new_file).parent)
              if new_parent == ".":
                  new_parent = ""
              relative = posixpath.relpath(target, start=new_parent or ".")
              return relative + anchor

          text_paths = sorted(
              path
              for path in root.rglob("*")
              if path.is_file()
              and ".git" not in path.parts
              and path.suffix.lower() in {".md", ".yml", ".yaml"}
          )

          for path in text_paths:
              relative = path.relative_to(root).as_posix()
              old_relative = reverse_moves.get(relative, relative)
              text = path.read_text(encoding="utf-8")

              def replace_markdown(match):
                  return (
                      match.group(1)
                      + rewrite_destination(match.group(2), old_relative, relative)
                      + match.group(3)
                  )

              def replace_href(match):
                  return (
                      match.group(1)
                      + rewrite_destination(match.group(2), old_relative, relative)
                      + match.group(3)
                  )

              updated = markdown_link.sub(replace_markdown, text)
              updated = html_href.sub(replace_href, updated)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          structure_tree = """```text
          python-study-guide/
          ├── .github/
          │   ├── ISSUE_TEMPLATE/
          │   │   ├── bug-report.yml
          │   │   ├── config.yml
          │   │   ├── content-suggestion.yml
          │   │   ├── learning-question.yml
          │   │   ├── private-contact-request.yml
          │   │   └── translation-improvement.yml
          │   └── pull_request_template.md
          ├── .gitignore
          ├── AGENTS.md
          ├── AUTHORS.md
          ├── CODE_OF_CONDUCT.md
          ├── CONTRIBUTING.md
          ├── LICENSE
          ├── README.md
          ├── SECURITY.md
          ├── SUPPORT.md
          ├── assets/
          │   └── README.md
          ├── comments-and-documentation/
          │   ├── README.md
          │   ├── README.pt-BR.md
          │   ├── README.es.md
          │   └── 01-comments/
          │       ├── README.md
          │       ├── README.pt-BR.md
          │       ├── README.es.md
          │       └── examples/
          │           ├── business_rule_comments.py
          │           ├── unnecessary_comments.py
          │           └── useful_comments.py
          ├── docs/
          │   ├── ai-assisted-development/
          │   │   ├── README.en.md
          │   │   ├── README.pt-BR.md
          │   │   └── README.es.md
          │   ├── localized/
          │   │   ├── AUTHORS.pt-BR.md
          │   │   ├── AUTHORS.es.md
          │   │   ├── CODE_OF_CONDUCT.pt-BR.md
          │   │   ├── CODE_OF_CONDUCT.es.md
          │   │   ├── CONTRIBUTING.pt-BR.md
          │   │   ├── CONTRIBUTING.es.md
          │   │   ├── README.pt-BR.md
          │   │   ├── README.es.md
          │   │   ├── SECURITY.pt-BR.md
          │   │   ├── SECURITY.es.md
          │   │   ├── SUPPORT.pt-BR.md
          │   │   └── SUPPORT.es.md
          │   ├── project-structure.en.md
          │   ├── project-structure.pt-BR.md
          │   ├── project-structure.es.md
          │   ├── roadmap.en.md
          │   ├── roadmap.pt-BR.md
          │   └── roadmap.es.md
          ├── exercises/
          │   └── README.md
          ├── external-libraries/
          │   └── README.md
          ├── functions/
          │   └── README.md
          ├── fundamentals/
          │   └── README.md
          ├── practical-projects/
          │   └── README.md
          ├── standard-library/
          │   └── README.md
          └── tests/
              └── README.md
          ```"""
          structure_tree = "\n".join(line[10:] if line.startswith("          ") else line for line in structure_tree.splitlines())

          structure_files = {
              "docs/project-structure.en.md": {
                  "root_heading": "## Root file guide",
                  "directory_heading": "## Directory guide",
                  "root_section": """## Root file guide

          - `.gitignore`: prevents local Python artifacts and other generated files from being committed.
          - `AGENTS.md`: repository-wide instructions for contributors and AI agents.
          - `AUTHORS.md`: canonical English project authorship, maintenance, and contribution-credit record.
          - `CODE_OF_CONDUCT.md`: canonical English community behavior and private-reporting policy recognized by GitHub.
          - `CONTRIBUTING.md`: canonical English contribution workflow and quality expectations recognized by GitHub.
          - `LICENSE`: the MIT License applied to the repository.
          - `README.md`: canonical English repository entry point recognized by GitHub.
          - `SECURITY.md`: canonical English security scope and private vulnerability-reporting policy recognized by GitHub.
          - `SUPPORT.md`: canonical English support routing and project-support boundaries.

          """,
                  "localized_note": "The `localized/` directory contains the Brazilian Portuguese and Spanish versions of the root-level project, authorship, contribution, conduct, security, and support documents. Keeping only canonical English community files at the repository root prevents ambiguous GitHub tab detection while preserving complete multilingual navigation.",
                  "language_paragraph": "English uses the canonical root files recognized automatically by GitHub. Brazilian Portuguese and Spanish versions of those documents are stored in `docs/localized/`. Learning sections may keep their localized README files beside the English chapter when that improves navigation.",
              },
              "docs/project-structure.pt-BR.md": {
                  "root_heading": "## Guia dos arquivos da raiz",
                  "directory_heading": "## Guia de diretórios",
                  "root_section": """## Guia dos arquivos da raiz

          - `.gitignore`: impede que artefatos locais do Python e outros arquivos gerados sejam versionados.
          - `AGENTS.md`: reúne instruções gerais do repositório para colaboradores e agentes de IA.
          - `AUTHORS.md`: registro canônico em inglês sobre autoria, manutenção e crédito das contribuições.
          - `CODE_OF_CONDUCT.md`: política canônica em inglês sobre conduta e relatos privados, reconhecida pelo GitHub.
          - `CONTRIBUTING.md`: fluxo canônico em inglês para contribuições e critérios de qualidade, reconhecido pelo GitHub.
          - `LICENSE`: contém a Licença MIT aplicada ao repositório.
          - `README.md`: porta de entrada canônica em inglês reconhecida pelo GitHub.
          - `SECURITY.md`: política canônica em inglês sobre segurança e relatos privados de vulnerabilidades, reconhecida pelo GitHub.
          - `SUPPORT.md`: orientação canônica em inglês sobre canais e limites do suporte do projeto.

          """,
                  "localized_note": "O diretório `localized/` contém as versões em português brasileiro e espanhol dos documentos principais do projeto, autoria, contribuição, conduta, segurança e suporte. Manter somente os arquivos canônicos em inglês na raiz evita detecção ambígua das abas automáticas do GitHub sem reduzir a navegação multilíngue.",
                  "language_paragraph": "O inglês utiliza os arquivos canônicos da raiz reconhecidos automaticamente pelo GitHub. As versões em português brasileiro e espanhol desses documentos ficam em `docs/localized/`. Seções de aprendizagem podem manter os READMEs traduzidos ao lado do capítulo em inglês quando isso melhorar a navegação.",
              },
              "docs/project-structure.es.md": {
                  "root_heading": "## Guía de los archivos raíz",
                  "directory_heading": "## Guía de directorios",
                  "root_section": """## Guía de los archivos raíz

          - `.gitignore`: evita que se versionen artefactos locales de Python y otros archivos generados.
          - `AGENTS.md`: reúne instrucciones generales del repositorio para colaboradores y agentes de IA.
          - `AUTHORS.md`: registro canónico en inglés sobre autoría, mantenimiento y reconocimiento de contribuciones.
          - `CODE_OF_CONDUCT.md`: política canónica en inglés sobre conducta e informes privados, reconocida por GitHub.
          - `CONTRIBUTING.md`: flujo canónico en inglés para contribuciones y expectativas de calidad, reconocido por GitHub.
          - `LICENSE`: contiene la Licencia MIT aplicada al repositorio.
          - `README.md`: punto de entrada canónico en inglés reconocido por GitHub.
          - `SECURITY.md`: política canónica en inglés sobre seguridad e informes privados de vulnerabilidades, reconocida por GitHub.
          - `SUPPORT.md`: orientación canónica en inglés sobre canales y límites del soporte del proyecto.

          """,
                  "localized_note": "El directorio `localized/` contiene las versiones en portugués de Brasil y español de los documentos principales del proyecto, autoría, contribución, conducta, seguridad y soporte. Mantener solamente los archivos canónicos en inglés en la raíz evita una detección ambigua de las pestañas automáticas de GitHub sin reducir la navegación multilingüe.",
                  "language_paragraph": "El inglés utiliza los archivos canónicos de la raíz reconocidos automáticamente por GitHub. Las versiones en portugués de Brasil y español de esos documentos se almacenan en `docs/localized/`. Las secciones de aprendizaje pueden mantener sus READMEs traducidos junto al capítulo en inglés cuando eso mejore la navegación.",
              },
          }

          for file_name, settings in structure_files.items():
              path = root / file_name
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  r"```text\npython-study-guide/.*?\n```",
                  structure_tree,
                  text,
                  count=1,
                  flags=re.S,
              )
              start = text.index(settings["root_heading"])
              end = text.index(settings["directory_heading"])
              text = text[:start] + settings["root_section"] + text[end:]

              docs_line_pattern = re.compile(r"^- `docs/`:.*$", re.M)
              docs_line = next((line for line in text.splitlines() if line.startswith("- `docs/`")), None)
              if docs_line is None:
                  raise RuntimeError(f"Missing docs directory description in {file_name}")
              replacement = docs_line + " " + settings["localized_note"]
              text = text.replace(docs_line, replacement, 1)

              heading = {
                  "docs/project-structure.en.md": "## Naming and language conventions",
                  "docs/project-structure.pt-BR.md": "## Convenções de nomes e idiomas",
                  "docs/project-structure.es.md": "## Convenciones de nombres e idiomas",
              }[file_name]
              maintenance = {
                  "docs/project-structure.en.md": "## Maintenance rule",
                  "docs/project-structure.pt-BR.md": "## Regra de manutenção",
                  "docs/project-structure.es.md": "## Regla de mantenimiento",
              }[file_name]
              convention_start = text.index(heading)
              maintenance_start = text.index(maintenance)
              existing = text[convention_start:maintenance_start]
              first_paragraph_end = existing.find("\n\n", len(heading))
              first_paragraph_end = existing.find("\n\n", first_paragraph_end + 2)
              prefix = existing[:first_paragraph_end + 2]
              new_conventions = prefix + settings["language_paragraph"] + "\n\n"
              text = text[:convention_start] + new_conventions + text[maintenance_start:]
              path.write_text(text, encoding="utf-8")

          print("Localized root layout applied successfully.")

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: organize localized root documents [localized-layout-applied]"
          git push origin HEAD:fix/localize-root-documents
