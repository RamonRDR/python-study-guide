name: Sync User Registration governance

on:
  push:
    branches:
      - phase-10-user-registration

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase-10-user-registration
          fetch-depth: 0

      - name: Synchronize Phase 10 governance
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement target, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          manifest = Path("scripts/example_manifest.txt")
          manifest_text = manifest.read_text(encoding="utf-8")
          demo_line = "practical-projects/03-user-registration/demo.py"
          if demo_line not in manifest_text.splitlines():
              anchor = "practical-projects/02-grade-calculator/demo.py\n"
              if anchor not in manifest_text:
                  raise RuntimeError("example manifest anchor not found")
              manifest_text = manifest_text.replace(anchor, anchor + demo_line + "\n", 1)
              manifest.write_text(manifest_text, encoding="utf-8")

          old_tree = """│   └── 02-grade-calculator/
          │       ├── README.md
          │       ├── README.pt-BR.md
          │       ├── README.es.md
          │       ├── demo.py
          │       ├── grade_calculator.py
          │       └── tests/
          │           ├── conftest.py
          │           └── test_grade_calculator.py
          """
          new_tree = """│   ├── 02-grade-calculator/
          │   │   ├── README.md
          │   │   ├── README.pt-BR.md
          │   │   ├── README.es.md
          │   │   ├── demo.py
          │   │   ├── grade_calculator.py
          │   │   └── tests/
          │   │       ├── conftest.py
          │   │       └── test_grade_calculator.py
          │   └── 03-user-registration/
          │       ├── README.md
          │       ├── README.pt-BR.md
          │       ├── README.es.md
          │       ├── demo.py
          │       ├── user_registration.py
          │       └── tests/
          │           ├── conftest.py
          │           └── test_user_registration.py
          """
          for path in (
              "docs/project-structure.en.md",
              "docs/project-structure.pt-BR.md",
              "docs/project-structure.es.md",
          ):
              replace_once(path, old_tree, new_tree)

          replace_once(
              "docs/roadmap.pt-BR.md",
              "| 10. Projetos práticos | Em andamento | Projeto 01 Controle de Despesas integra validação, dinheiro exato, JSON, CSV e pytest em um fluxo completo |",
              "| 10. Projetos práticos | Em andamento | Projetos 01–03 cobrem fluxos monetários validados, regras configuráveis de notas e regras canônicas de cadastro de usuários com testes automatizados |",
          )
          replace_once(
              "docs/roadmap.pt-BR.md",
              "As Fases 0–9 estão concluídas. A Fase 10: Projetos Práticos está em andamento com o Controle de Despesas disponível como Projeto 01. A fase de projetos práticos transforma conceitos já estudados em fluxos completos com requisitos, decisões de design, implementação, validação, caminhos de extensão e discussão de portfólio.",
              "As Fases 0–9 estão concluídas. A Fase 10: Projetos Práticos está em andamento com Controle de Despesas, Calculadora de Notas e Cadastro de Usuários disponíveis como Projetos 01–03. A fase de projetos práticos transforma conceitos já estudados em fluxos completos com requisitos, decisões de design, implementação, validação, caminhos de extensão e discussão de portfólio.",
          )
          replace_once(
              "docs/roadmap.pt-BR.md",
              "- [ ] Cadastro de Usuários",
              "- [x] [Cadastro de Usuários](../practical-projects/03-user-registration/README.pt-BR.md)",
          )
          replace_once(
              "docs/roadmap.pt-BR.md",
              "O Projeto 01 estabelece o contrato da Fase 10 com requisitos explícitos, modelagem de dados validada, dinheiro exato com `Decimal`, persistência, demonstração determinística, cobertura automatizada com pytest, desafios de extensão e discussão de portfólio. O Projeto 02 amplia o contrato com regras de notas configuráveis, agregação ponderada exata, relatório parcial/final explícito e validação focada em fronteiras.",
              "O Projeto 01 estabelece o contrato da Fase 10 com requisitos explícitos, modelagem de dados validada, dinheiro exato com `Decimal`, persistência, demonstração determinística, cobertura automatizada com pytest, desafios de extensão e discussão de portfólio. O Projeto 02 amplia o contrato com regras de notas configuráveis, agregação ponderada exata, relatório parcial/final explícito e validação focada em fronteiras. O Projeto 03 adiciona dados de identidade canônicos, normalização Unicode e IDNA, prevenção de duplicidade, índices secundários, atualizações seguras e transições explícitas de ciclo de vida sem introduzir autenticação.",
          )

          replace_once(
              "docs/roadmap.es.md",
              "| 10. Proyectos prácticos | En progreso | Proyecto 01 Control de Gastos integra validación, dinero exacto, JSON, CSV y pytest en un flujo completo |",
              "| 10. Proyectos prácticos | En progreso | Los Proyectos 01–03 cubren flujos monetarios validados, reglas configurables de calificación y reglas canónicas de registro de usuarios con pruebas automatizadas |",
          )
          replace_once(
              "docs/roadmap.es.md",
              "Las Fases 0–9 están completadas. La Fase 10: Proyectos Prácticos está en progreso con el Control de Gastos disponible como Proyecto 01. La fase de proyectos prácticos transforma conceptos ya estudiados en flujos completos con requisitos, decisiones de diseño, implementación, validación, caminos de extensión y discusión de portafolio.",
              "Las Fases 0–9 están completadas. La Fase 10: Proyectos Prácticos está en progreso con Control de Gastos, Calculadora de Notas y Registro de Usuarios disponibles como Proyectos 01–03. La fase de proyectos prácticos transforma conceptos ya estudiados en flujos completos con requisitos, decisiones de diseño, implementación, validación, caminos de extensión y discusión de portafolio.",
          )
          replace_once(
              "docs/roadmap.es.md",
              "- [ ] Registro de Usuarios",
              "- [x] [Registro de Usuarios](../practical-projects/03-user-registration/README.es.md)",
          )
          replace_once(
              "docs/roadmap.es.md",
              "El Proyecto 01 establece el contrato de la Fase 10 con requisitos explícitos, modelado de datos validado, dinero exacto con `Decimal`, persistencia, demostración determinista, cobertura automatizada con pytest, desafíos de ampliación y discusión de portafolio. El Proyecto 02 amplía el contrato con reglas de calificación configurables, agregación ponderada exacta, informe parcial/final explícito y validación centrada en límites.",
              "El Proyecto 01 establece el contrato de la Fase 10 con requisitos explícitos, modelado de datos validado, dinero exacto con `Decimal`, persistencia, demostración determinista, cobertura automatizada con pytest, desafíos de ampliación y discusión de portafolio. El Proyecto 02 amplía el contrato con reglas de calificación configurables, agregación ponderada exacta, informe parcial/final explícito y validación centrada en límites. El Proyecto 03 añade datos de identidad canónicos, normalización Unicode e IDNA, prevención de duplicados, índices secundarios, actualizaciones seguras y transiciones explícitas del ciclo de vida sin introducir autenticación.",
          )
          PY

      - name: Commit synchronized documentation
        run: |
          if git diff --quiet; then
            echo "No synchronization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/example_manifest.txt
          git commit -m "Synchronize User Registration governance"
          git push origin HEAD:phase-10-user-registration
