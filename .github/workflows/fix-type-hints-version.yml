name: Fix Type Hints version note

on:
  push:
    branches:
      - agent/add-type-hints

permissions:
  contents: write

jobs:
  fix-version-note:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed version note
        run: |
          python - <<'PY'
          from pathlib import Path

          updates = {
              "functions/05-type-hints/README.md": (
                  "**Estimated study time:** 75–100 minutes.",
                  "**Python version:** This chapter requires **Python 3.10 or newer**."
              ),
              "functions/05-type-hints/README.pt-BR.md": (
                  "**Tempo estimado de estudo:** 75–100 minutos.",
                  "**Versão do Python:** este capítulo requer **Python 3.10 ou mais recente**."
              ),
              "functions/05-type-hints/README.es.md": (
                  "**Tiempo estimado de estudio:** 75–100 minutos.",
                  "**Versión de Python:** este capítulo requiere **Python 3.10 o posterior**."
              ),
          }

          for filename, (marker, note) in updates.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if note not in text:
                  if marker not in text:
                      raise SystemExit(f"Marker not found in {filename}")
                  text = text.replace(marker, marker + "\n\n" + note, 1)
                  path.write_text(text, encoding="utf-8")

          for filename in (
              "functions/05-type-hints/.probe",
              "functions/05-type-hints/.version-probe",
              "functions/05-type-hints/README.version.en.md",
              ".github/workflows/fix-type-hints-version.yml",
          ):
              path = Path(filename)
              if path.exists():
                  path.unlink()
          PY

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: declare Python 3.10 requirement"
          git push origin HEAD:agent/add-type-hints
