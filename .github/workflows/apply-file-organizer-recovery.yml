name: Apply File Organizer recovery patch

on:
  push:
    branches:
      - phase-10-file-organizer
    paths:
      - .github/workflows/apply-file-organizer-recovery.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: phase-10-file-organizer

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=9.1,<9.2"

      - name: Apply focused patch
        env:
          PATCH_B64: "  dW4gYXJjaGl2byByZWd1bGFyIGV4Y2x1c2l2byBgLmZvLXJlY292ZXJ5LSpgLiBFc3RhIHJlY3VwZXJhY2nDs24gY29uc2VydmEgbG9zIGRhdG9zOyBubyBhZmlybWEgcXVlIGVsIGlub2RlIG9yaWdpbmFsIGhheWEgc29icmV2aXZpZG8uXG5cbiIsCiAgICApLAp9CmZvciBwYXRoLCAob2xkLCBuZXcpIGluIGRvY3MuaXRlbXMoKToKICAgIHJlcGxhY2Vfb25jZShwYXRoLCBvbGQsIG5ldykK"
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/file_organizer_patch.py
          python /tmp/file_organizer_patch.py

      - name: Validate focused patch
        run: |
          python -m py_compile practical-projects/06-file-organizer/file_organizer.py practical-projects/06-file-organizer/tests/test_atomic_move.py
          python -m pytest -q practical-projects/06-file-organizer/tests
          python scripts/check_internal_links.py
          python scripts/validate_repository_structure.py
          git diff --check

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/apply-file-organizer-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve source data after staging race"
          git push origin HEAD:phase-10-file-organizer
