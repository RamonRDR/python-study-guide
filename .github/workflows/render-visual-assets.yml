name: Render visual identity assets

on:
  push:
    branches:
      - design/project-visual-identity
    paths:
      - .github/workflows/render-visual-assets.yml

permissions:
  contents: write

jobs:
  render-assets:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out visual identity branch
        uses: actions/checkout@v4
        with:
          ref: design/project-visual-identity

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin

      - name: Render PNG assets
        run: |
          rsvg-convert --width 1200 --height 400 assets/banner.svg --output assets/banner.png
          rsvg-convert --width 1280 --height 640 assets/repository-preview.svg --output assets/repository-preview.png
          file assets/banner.png assets/repository-preview.png

      - name: Commit rendered assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/render-visual-assets.yml
          git add assets/banner.png assets/repository-preview.png .github/workflows/render-visual-assets.yml
          git commit -m "design: render visual identity assets"
          git push origin HEAD:design/project-visual-identity
