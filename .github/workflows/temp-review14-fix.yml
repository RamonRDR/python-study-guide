name: Temporary Review 14 fix

on:
  push:
    branches:
      - phase-10-file-organizer
    paths:
      - .github/workflows/temp-review14-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: phase-10-file-organizer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check 'pytest>=9.1,<9.2'

      - name: Apply focused patch
        run: python scripts/_temp_review14_fix.py

      - name: Validate focused File Organizer suite
        run: python -m pytest -q practical-projects/06-file-organizer/tests

      - name: Validate links and repository structure
        run: |
          python scripts/check_internal_links.py
          python scripts/validate_repository_structure.py
          git diff --check

      - name: Commit functional fix and remove temporary tooling
        shell: bash
        run: |
          git config user.name 'RamonRDR'
          git config user.email 'ramoncorreka@hotmail.com'
          rm scripts/_temp_review14_fix.py
          rm .github/workflows/temp-review14-fix.yml
          git add -A
          git status --short
          git commit -m 'Verify recovery pathname retention'
          git push origin HEAD:phase-10-file-organizer
