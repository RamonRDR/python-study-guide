name: Repository quality checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Show Python version
        run: python --version

      - name: Install external-library dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-external.txt

      - name: Compile Python files
        run: python -m compileall -q -x '(^|/)\.git/' .

      - name: Run quality script tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run approved examples
        run: python scripts/run_examples.py

      - name: Run practical project tests
        run: python -m pytest -q practical-projects

      - name: Check internal Markdown links
        run: python scripts/check_internal_links.py

      - name: Validate repository structure
        run: python scripts/validate_repository_structure.py
