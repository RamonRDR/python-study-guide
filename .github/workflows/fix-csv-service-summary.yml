name: Fix CSV summary service validation

on:
  push:
    branches:
      - phase-10-csv-analyzer

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase-10-csv-analyzer
          fetch-depth: 0

      - name: Apply service summary validation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected one replacement target, found {count}"
                  )
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          code_path = "practical-projects/04-csv-analyzer/csv_analyzer.py"
          old_code = (
              '        service_keys = tuple(\n'
              '            service.casefold() for service, _ in self.service_counts\n'
              '        )\n'
          )
          new_code = (
              '        if any(\n'
              '            normalize_service(service) != service\n'
              '            for service, _ in self.service_counts\n'
              '        ):\n'
              '            raise ValueError(\n'
              '                "service_counts service names must be normalized"\n'
              '            )\n'
          ) + old_code
          replace_once(code_path, old_code, new_code)

          test_path = Path(
              "practical-projects/04-csv-analyzer/tests/test_csv_analyzer.py"
          )
          tests = test_path.read_text(encoding="utf-8")
          marker = "def test_incident_summary_rejects_non_normalized_service_names():"
          if marker in tests:
              raise RuntimeError("service summary regression already exists")
          tests += (
              '\n\n'
              'def test_incident_summary_rejects_non_normalized_service_names():\n'
              '    severity_counts = tuple(\n'
              '        (severity, 1 if severity is Severity.LOW else 0)\n'
              '        for severity in Severity\n'
              '    )\n'
              '    for service in ("   ", " Portal "):\n'
              '        with pytest.raises(ValueError):\n'
              '            IncidentSummary(\n'
              '                1,\n'
              '                1,\n'
              '                0,\n'
              '                5,\n'
              '                Decimal("5.00"),\n'
              '                5,\n'
              '                severity_counts,\n'
              '                ((service, 1),),\n'
              '            )\n'
          )
          test_path.write_text(tests, encoding="utf-8")

          replace_once(
              "practical-projects/04-csv-analyzer/README.md",
              "- service keys must be unique case-insensitively;",
              "- service names must already satisfy the same whitespace normalization contract as incident records;\n- service keys must be unique case-insensitively;",
          )
          replace_once(
              "practical-projects/04-csv-analyzer/README.md",
              "**75 pytest scenarios**",
              "**76 pytest scenarios**",
          )
          replace_once(
              "practical-projects/04-csv-analyzer/README.pt-BR.md",
              "- chaves de serviço devem ser únicas sem diferenciar capitalização;",
              "- nomes de serviço devem já atender ao mesmo contrato de normalização de espaços dos registros de incidente;\n- chaves de serviço devem ser únicas sem diferenciar capitalização;",
          )
          replace_once(
              "practical-projects/04-csv-analyzer/README.pt-BR.md",
              "**75 cenários pytest**",
              "**76 cenários pytest**",
          )
          replace_once(
              "practical-projects/04-csv-analyzer/README.es.md",
              "- las claves de servicio deben ser únicas sin distinguir capitalización;",
              "- los nombres de servicio deben cumplir previamente el mismo contrato de normalización de espacios que los registros de incidente;\n- las claves de servicio deben ser únicas sin distinguir capitalización;",
          )
          replace_once(
              "practical-projects/04-csv-analyzer/README.es.md",
              "**75 escenarios pytest**",
              "**76 escenarios pytest**",
          )
          PY

      - name: Install pytest
        run: python -m pip install -q pytest

      - name: Validate focused project
        run: |
          python -m compileall -q practical-projects/04-csv-analyzer
          python -m pytest -q practical-projects/04-csv-analyzer/tests
          python practical-projects/04-csv-analyzer/demo.py

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add practical-projects/04-csv-analyzer
          git commit -m "Validate CSV summary service names"
          git push origin HEAD:phase-10-csv-analyzer
