name: Sync CSV Analyzer governance

on:
  push:
    branches:
      - phase-10-csv-analyzer

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: phase-10-csv-analyzer
          fetch-depth: 0

      - name: Synchronize Phase 10 governance
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected one replacement target, found {count}"
                  )
              file_path.write_text(
                  text.replace(old, new, 1),
                  encoding="utf-8",
              )

          manifest = Path("scripts/example_manifest.txt")
          manifest_text = manifest.read_text(encoding="utf-8")
          demo_line = "practical-projects/04-csv-analyzer/demo.py"
          if demo_line not in manifest_text.splitlines():
              anchor = "practical-projects/03-user-registration/demo.py\n"
              if anchor not in manifest_text:
                  raise RuntimeError("example manifest anchor not found")
              manifest_text = manifest_text.replace(
                  anchor,
                  anchor + demo_line + "\n",
                  1,
              )
              manifest.write_text(manifest_text, encoding="utf-8")

          old_tree = """│   └── 03-user-registration/
          │       ├── README.md
          │       ├── README.pt-BR.md
          │       ├── README.es.md
          │       ├── demo.py
          │       ├── user_registration.py
          │       └── tests/
          │           ├── conftest.py
          │           └── test_user_registration.py
          """
          new_tree = """│   ├── 03-user-registration/
          │   │   ├── README.md
          │   │   ├── README.pt-BR.md
          │   │   ├── README.es.md
          │   │   ├── demo.py
          │   │   ├── user_registration.py
          │   │   └── tests/
          │   │       ├── conftest.py
          │   │       └── test_user_registration.py
          │   └── 04-csv-analyzer/
          │       ├── README.md
          │       ├── README.pt-BR.md
          │       ├── README.es.md
          │       ├── csv_analyzer.py
          │       ├── demo.py
          │       └── tests/
          │           ├── conftest.py
          │           └── test_csv_analyzer.py
          """
          for path in (
              "docs/project-structure.en.md",
              "docs/project-structure.pt-BR.md",
              "docs/project-structure.es.md",
          ):
              replace_once(path, old_tree, new_tree)

          replace_once(
              "practical-projects/README.md",
              "4. ⏳ CSV Analyzer",
              "4. ✅ [CSV Analyzer](04-csv-analyzer/README.md)",
          )
          replace_once(
              "practical-projects/README.md",
              "Project 01 establishes the integration pattern with validated monetary records and persistence. Project 02 extends it with configurable grading policies, exact weighted aggregation, explicit partial/final states, structured reporting, and boundary-focused pytest coverage. Project 03 adds canonical identity-like data, duplicate prevention, secondary lookup indexes, safe indexed-field updates, and explicit user lifecycle transitions without introducing authentication.",
              "Project 01 establishes the integration pattern with validated monetary records and persistence. Project 02 extends it with configurable grading policies, exact weighted aggregation, explicit partial/final states, structured reporting, and boundary-focused pytest coverage. Project 03 adds canonical identity-like data, duplicate prevention, secondary lookup indexes, safe indexed-field updates, and explicit user lifecycle transitions without introducing authentication. Project 04 adds exact CSV schemas, typed conversion, structural-versus-row failure handling, partial-success parsing, duplicate row identifiers, deterministic filtering, and aggregation without hiding ingestion behavior behind pandas.",
          )

          replace_once(
              "practical-projects/README.pt-BR.md",
              "4. ⏳ Analisador CSV",
              "4. ✅ [Analisador CSV](04-csv-analyzer/README.pt-BR.md)",
