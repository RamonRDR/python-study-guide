name: Retry Review 12 recovery fix

on:
  push:
    branches:
      - phase-10-file-organizer

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: phase-10-file-organizer
          fetch-depth: 0

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest>=9.1,<9.2"

      - name: Reuse focused patch from first workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-review12-recovery.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          start_marker = "          python - <<'PY'"
          end_marker = "          PY"
          start = lines.index(start_marker) + 1
          end = lines.index(end_marker, start)
          code_lines = []
          for line in lines[start:end]:
              if line.startswith('          '):
                  line = line[10:]
              code_lines.append(line)
          code = '\n'.join(code_lines) + '\n'
          exec(compile(code, str(workflow), 'exec'))
          PY

      - name: Run focused validation
        run: |
          python -m pytest -q practical-projects/06-file-organizer/tests
          python -m compileall -q practical-projects/06-file-organizer

      - name: Remove temporary workflows and commit fix
        shell: bash
        run: |
          rm .github/workflows/apply-review12-recovery.yml
          rm .github/workflows/retry-review12-recovery.yml
          git config user.name "Ramon Rodriguez"
          git config user.email "ramoncorreka@hotmail.com"
          git add practical-projects/06-file-organizer .github/workflows/apply-review12-recovery.yml .github/workflows/retry-review12-recovery.yml
          git commit -m "Recover pinned source on failed final rename"
          git push origin HEAD:phase-10-file-organizer
