name: Apply File Organizer Review 8 fixes

on:
  push:
    branches:
      - phase-10-file-organizer
    paths:
      - .github/workflows/apply-file-organizer-review8.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: phase-10-file-organizer

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest>=9.1,<9.2"

      - name: Apply Review 8 fixes
        run: python scripts/_apply_file_organizer_review8.py

      - name: Validate focused changes
        run: |
          python -m py_compile practical-projects/06-file-organizer/file_organizer.py practical-projects/06-file-organizer/tests/test_atomic_move.py
          python -m pytest -q practical-projects/06-file-organizer/tests
          git diff --check

      - name: Commit Review 8 fixes
        run: |
          rm scripts/_apply_file_organizer_review8.py
          git config user.name "Ramon Rodriguez"
          git config user.email "ramoncorreka@hotmail.com"
          git add practical-projects/06-file-organizer scripts/_apply_file_organizer_review8.py
          git commit -m "Harden File Organizer permission and FD handling"
          git push origin HEAD:phase-10-file-organizer
