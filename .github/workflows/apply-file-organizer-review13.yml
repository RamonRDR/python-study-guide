name: Apply File Organizer Review 13 fix

on:
  push:
    branches:
      - phase-10-file-organizer
    paths:
      - .github/workflows/apply-file-organizer-review13.yml
      - scripts/_apply_file_organizer_review13.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-10-file-organizer
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check 'pytest>=9.1,<9.2'

      - name: Apply Review 13 fix
        run: python scripts/_apply_file_organizer_review13.py

      - name: Validate focused suite
        run: |
          python -m compileall -q practical-projects/06-file-organizer
          python -m pytest -q practical-projects/06-file-organizer/tests
          git diff --check

      - name: Commit clean fix and remove temporary tooling
        run: |
          git config user.name 'RamonRDR'
          git config user.email 'ramoncorreka@hotmail.com'
          git rm scripts/_apply_file_organizer_review13.py
          git rm .github/workflows/apply-file-organizer-review13.yml
          git add practical-projects/06-file-organizer/file_organizer.py
          git add practical-projects/06-file-organizer/tests/test_atomic_move.py
          git add practical-projects/06-file-organizer/README.md
          git add practical-projects/06-file-organizer/README.pt-BR.md
          git add practical-projects/06-file-organizer/README.es.md
          git commit -m 'Verify restored source identity after recovery link'
          git push origin HEAD:phase-10-file-organizer
