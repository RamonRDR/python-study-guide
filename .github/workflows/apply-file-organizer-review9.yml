name: Apply File Organizer Review 9 fix

on:
  push:
    branches:
      - phase-10-file-organizer

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run focused File Organizer Review 9 fix'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: phase-10-file-organizer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check 'pytest>=9.1,<9.2'

      - name: Apply Review 9 fix
        run: python scripts/_apply_file_organizer_review9.py

      - name: Validate focused changes
        run: |
          python -m compileall -q practical-projects/06-file-organizer
          python -m pytest -q practical-projects/06-file-organizer/tests

      - name: Commit Review 9 fix
        run: |
          git config user.name 'Ramon Rodriguez'
          git config user.email 'ramoncorreka@hotmail.com'
          git rm scripts/_apply_file_organizer_review9.py
          git add practical-projects/06-file-organizer/file_organizer.py
          git add practical-projects/06-file-organizer/tests/test_file_organizer.py
          git add practical-projects/06-file-organizer/README.md
          git add practical-projects/06-file-organizer/README.pt-BR.md
          git add practical-projects/06-file-organizer/README.es.md
          git commit -m 'Reject Windows junction category redirects'
          git push origin HEAD:phase-10-file-organizer
