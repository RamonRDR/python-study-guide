<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Python Study Guide repository preview</title>
  <desc id="desc">Social preview with the project serpent and book emblem, project name, and Study. Understand. Practice. motto.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
