<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Python Study Guide</title>
  <desc id="desc">Dark blue banner with the Python Study Guide serpent and book emblem, the project name, and the motto Study. Understand. Practice.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020b18"/>
      <stop offset="0.55" stop-color="#061827"/>
      <stop offset="1" stop-color="#03111d"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59e1ff"/>
      <stop offset="0.48" stop-color="#00d0c9"/>
      <stop offset="1" stop-color="#17c964"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00d0c9" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#00d0c9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#background)"/>
  <circle cx="210" cy="205" r="170" fill="url(#glow)" filter="url(#softGlow)"/>
  <g opacity="0.22" stroke="#00d0c9" fill="none">
    <path d="M0 315 C120 245 180 360 310 274 S520 235 610 280"/>
    <path d="M850 75 C970 135 1050 32 1200 105"/>
    <path d="M840 330 C955 260 1075 348 1200 292"/>
  </g>
  <g fill="#59e1ff" opacity="0.55">
    <circle cx="45" cy="306" r="5"/><circle cx="128" cy="276" r="8"/><circle cx="325" cy="282" r="5"/>
    <circle cx="928" cy="112" r="5"/><circle cx="1048" cy="72" r="7"/><circle cx="1134" cy="96" r="4"/>
    <circle cx="936" cy="294" r="4"/><circle cx="1082" cy="323" r="7"/>
  </g>
  <image x="34" y="22" width="330" height="330" href="data:image/png;base64,"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="390" y="150" fill="#ffffff" font-size="94" font-weight="800" letter-spacing="-3">Python</text>
    <text x="390" y="242" fill="url(#wordmark)" font-size="84" font-weight="800" letter-spacing="-3">Study Guide</text>
    <line x1="393" y1="278" x2="1115" y2="278" stroke="#00d0c9" stroke-width="4"/>
    <circle cx="393" cy="278" r="7" fill="#03111d" stroke="#00d0c9" stroke-width="4"/>
    <circle cx="1115" cy="278" r="7" fill="#03111d" stroke="#00d0c9" stroke-width="4"/>
    <text x="397" y="332" fill="#ffffff" font-size="35" font-weight="500">Study.<tspan fill="#59e1ff"> Understand.</tspan><tspan fill="#a7f070"> Practice.</tspan></text>
  </g>
</svg>
